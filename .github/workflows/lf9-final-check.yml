name: LF9 final build check

on:
  push:
    branches:
      - main
    paths:
      - 'src/data/lf9*.ts'
      - 'src/data/index.ts'
      - '.github/workflows/lf9-final-check.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Record successful final LF9 build
        run: |
          echo "LF9 final build successful" > public/.lf9-final-build-ok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.lf9-final-build-ok
          git commit -m "Verify final LF9 build"
          git push
