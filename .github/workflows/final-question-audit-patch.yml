name: Final question audit patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-question-audit-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Harden quick-check rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/ModuleDetailV4.tsx')
          text = path.read_text(encoding='utf-8')

          old = """  const correct = unique(correctValues.map(value => shortAnswer(value))).filter(Boolean);\n  return buildFiveOptions(questionText, correct, questionBank, seed, explicitDistractors);"""
          new = """  const correct = unique(correctValues.map(value => shortAnswer(value))).filter(Boolean);\n  const curatedDistractors = unique(explicitDistractors.map(value => shortAnswer(value))).filter(Boolean);\n  const hasCompleteLocalSet = correct.length + curatedDistractors.length >= 5;\n  return buildFiveOptions(questionText, correct, hasCompleteLocalSet ? [] : questionBank, seed, curatedDistractors);"""
          if old not in text:
              raise SystemExit('makeQuickCheckOptions target not found')
          text = text.replace(old, new, 1)

          old = """  const fallback = fallbackPractice('diesem Thema', blocks);\n  const selected = [...sources.slice(0, 2)];\n  while (selected.length < 2) selected.push(fallback[selected.length] || fallback[0]);\n  return selected.slice(0, 2).map((source, index) => ({"""
          new = """  const selected = [...sources.slice(0, 2)];\n  return selected.map((source, index) => ({"""
          if old not in text:
              raise SystemExit('buildChecks target not found')
          text = text.replace(old, new, 1)

          old = """    const parsed = practiceItems.map(item => parsePracticeItem(item, blocks));\n    const sources = parsed.length ? parsed : fallbackPractice(raw.title, blocks);"""
          new = """    const parsed = practiceItems.map(item => parsePracticeItem(item, blocks));\n    const sources = parsed;"""
          if old not in text:
              raise SystemExit('sources target not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              '>2 Klickfragen · Überspringen möglich</div>',
              '>{activeStep.checks.length} Klickfrage{activeStep.checks.length === 1 ? \'\' : \'n\'} · Überspringen möglich</div>',
              1,
          )
          text = text.replace(
              '>2 Fragen</div></div>',
              '>{activeStep.checks.length} Frage{activeStep.checks.length === 1 ? \'\' : \'n\'}</div></div>',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Build production site
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm run build
      - name: Commit verified patch
        run: |
          rm .github/workflows/final-question-audit-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ModuleDetailV4.tsx .github/workflows/final-question-audit-patch.yml
          git commit -m "Finalize topic-safe question audit"
          git push
