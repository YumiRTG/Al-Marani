name: Audit all question option coverage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-question-options.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript parser
        run: npm install --legacy-peer-deps
      - name: Audit base learning-field questions
        run: |
          cat > /tmp/audit.mjs <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';

          const overrides = fs.readFileSync('src/data/questionDistractorOverrides.ts', 'utf8');
          const hasOverride = (lf, id) => new RegExp(`['\"]${lf}:${id}['\"]\\s*:`).test(overrides);
          const rows = [];

          function literalText(node) {
            if (!node) return '';
            if (ts.isStringLiteral(node) || ts.isNoSubstitutionTemplateLiteral(node)) return node.text;
            return node.getText().replace(/^['\"]|['\"]$/g, '');
          }

          for (let n = 1; n <= 12; n += 1) {
            const lf = `lf${n}`;
            const path = `src/data/${lf}.ts`;
            const src = fs.readFileSync(path, 'utf8');
            const sf = ts.createSourceFile(path, src, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
            function visit(node) {
              if (ts.isPropertyAssignment(node) && node.name.getText(sf) === 'questions' && ts.isArrayLiteralExpression(node.initializer)) {
                for (const element of node.initializer.elements) {
                  if (!ts.isObjectLiteralExpression(element)) continue;
                  const props = Object.fromEntries(element.properties.filter(ts.isPropertyAssignment).map(p => [p.name.getText(sf), p.initializer]));
                  const id = Number(props.id?.getText(sf));
                  const question = literalText(props.question);
                  const type = literalText(props.type);
                  const optionCount = props.options && ts.isArrayLiteralExpression(props.options) ? props.options.elements.length : 0;
                  const override = hasOverride(lf, id);
                  if (type === 'text' || optionCount < 5) rows.push({ lf, id, type, optionCount, override, question });
                }
              }
              ts.forEachChild(node, visit);
            }
            visit(sf);
          }

          const uncovered = rows.filter(row => !row.override);
          fs.writeFileSync('public/question-option-audit.json', JSON.stringify({ totalNeedingFiveOptionSupport: rows.length, uncoveredCount: uncovered.length, uncovered }, null, 2));
          console.log(JSON.stringify({ total: rows.length, uncovered: uncovered.length }, null, 2));
          NODE
          node /tmp/audit.mjs
      - name: Commit audit report and remove workflow
        run: |
          rm .github/workflows/audit-question-options.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/question-option-audit.json .github/workflows/audit-question-options.yml
          git commit -m "Audit remaining five-option question gaps"
          git push
