name: Convert final text questions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-final-text-questions.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Convert every final question to selection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/ModuleDetailV4.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''function normalizeFinalQuestions(module: LearningModule): QuizQuestion[] {
  let keptOpen = false;
  return module.questions.map((question, index) => {
    if (question.type === 'single' || question.type === 'multiple') return { ...question, id: 20000 + index };
    if (question.type === 'text' && !keptOpen) {
      keptOpen = true;
      return { ...question, id: 20000 + index };
    }
    const correct = answerText(question);
    return {
      ...question,
      id: 20000 + index,
      type: 'single' as const,
      options: buildFiveOptions(question.question, [correct], module.questions, index * 9 + module.number * 7),
      correctAnswer: undefined,
    };
  });
}'''
          new = '''function normalizeFinalQuestions(module: LearningModule): QuizQuestion[] {
  return module.questions.map((question, index) => {
    if (question.type === 'single' || question.type === 'multiple') return { ...question, id: 20000 + index };
    const correct = answerText(question);
    return {
      ...question,
      id: 20000 + index,
      type: 'single' as const,
      options: buildFiveOptions(question.question, [correct], module.questions, index * 9 + module.number * 7),
      correctAnswer: undefined,
    };
  });
}'''
          if old not in text:
              raise SystemExit('normalizeFinalQuestions block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm run build
      - name: Commit and clean workflow
        run: |
          rm .github/workflows/convert-final-text-questions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ModuleDetailV4.tsx .github/workflows/convert-final-text-questions.yml
          git commit -m "Give every final question five answer options"
          git push
