name: Reward games build check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reward-games-check.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Record success and clean workflow
        run: |
          rm .github/workflows/reward-games-check.yml
          echo "reward games build successful" > public/.reward-games-build-ok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/reward-games-check.yml public/.reward-games-build-ok
          git commit -m "Verify reward games build"
          git push
