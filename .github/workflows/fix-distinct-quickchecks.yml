name: Fix distinct quick checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-distinct-quickchecks.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Make quick-check answers distinct
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/ModuleDetailV4.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''function buildChecks(sources: PracticeSource[], blocks: TopicContent[], seed: number): QuickCheck[] {
  const fallback = fallbackPractice('diesem Thema', blocks);
  const selected = [...sources.slice(0, 2)];
  while (selected.length < 2) selected.push(fallback[selected.length] || fallback[0]);
  const pool = unique([...learningPoints(blocks), ...sources.map(item => item.solution), ...fallback.map(item => item.solution)]);
  return selected.slice(0, 2).map((source, index) => ({
    question: source.question || 'Welche Aussage ist richtig?',
    options: makeOptions(source.solution, pool, seed + index * 11),
    explanation: source.solution,
  }));
}'''
          new = '''function buildChecks(sources: PracticeSource[], blocks: TopicContent[], seed: number): QuickCheck[] {
  const fallback = fallbackPractice('diesem Thema', blocks);
  const points = learningPoints(blocks);
  const candidates: PracticeSource[] = [
    ...sources,
    ...fallback,
    ...points.map((solution, index) => ({
      question: index === 0 ? 'Welche Kernaussage ist für diesen Abschnitt besonders wichtig?' : 'Welche weitere Aussage gehört zu diesem Lernabschnitt?',
      solution,
    })),
  ];

  const selected: PracticeSource[] = [];
  for (const candidate of candidates) {
    const solutionKey = shortAnswer(candidate.solution).toLowerCase();
    const questionKey = clean(candidate.question).toLowerCase();
    if (!solutionKey) continue;
    const sameSolution = selected.some(item => shortAnswer(item.solution).toLowerCase() === solutionKey);
    const sameQuestion = selected.some(item => clean(item.question).toLowerCase() === questionKey);
    if (!sameSolution && !sameQuestion) selected.push(candidate);
    if (selected.length === 2) break;
  }

  while (selected.length < 2) {
    const fallbackIndex = selected.length;
    const alternative = points.find(point => !selected.some(item => shortAnswer(item.solution).toLowerCase() === shortAnswer(point).toLowerCase()));
    selected.push({
      question: fallbackIndex === 0 ? 'Welche Aussage ist richtig?' : 'Welche zweite Kernaussage solltest du dir merken?',
      solution: alternative || fallback[fallbackIndex]?.solution || supportText(blocks),
    });
  }

  const pool = unique([...points, ...sources.map(item => item.solution), ...fallback.map(item => item.solution)]);
  return selected.slice(0, 2).map((source, index) => ({
    question: source.question || (index === 0 ? 'Welche Aussage ist richtig?' : 'Welche zweite Aussage ist richtig?'),
    options: makeOptions(source.solution, pool, seed + index * 11),
    explanation: source.solution,
  }));
}'''
          if old not in text:
              raise SystemExit('buildChecks block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm run build
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-distinct-quickchecks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ModuleDetailV4.tsx .github/workflows/fix-distinct-quickchecks.yml
          git commit -m "Ensure two distinct quick-check answers"
          git push
