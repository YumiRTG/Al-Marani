name: Final question gap audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-question-gaps.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Find questions that still need a curated fifth option
        run: |
          cat > /tmp/audit.mjs <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const overrideSource = fs.readFileSync('src/data/questionDistractorOverrides.ts','utf8');
          const rows=[];
          const literal=(node,sf)=>node && (ts.isStringLiteral(node)||ts.isNoSubstitutionTemplateLiteral(node)) ? node.text : (node?.getText(sf)||'').replace(/^['\"]|['\"]$/g,'');
          for(let n=1;n<=12;n++){
            const lf=`lf${n}`; const path=`src/data/${lf}.ts`; const source=fs.readFileSync(path,'utf8');
            const sf=ts.createSourceFile(path,source,ts.ScriptTarget.Latest,true,ts.ScriptKind.TS);
            const visit=node=>{
              if(ts.isPropertyAssignment(node)&&node.name.getText(sf)==='questions'&&ts.isArrayLiteralExpression(node.initializer)){
                for(const el of node.initializer.elements){
                  if(!ts.isObjectLiteralExpression(el)) continue;
                  const map={};
                  for(const p of el.properties) if(ts.isPropertyAssignment(p)) map[p.name.getText(sf)]=p.initializer;
                  const id=Number(map.id?.getText(sf)); const type=literal(map.type,sf); const question=literal(map.question,sf);
                  const options=map.options&&ts.isArrayLiteralExpression(map.options)?map.options.elements.length:0;
                  const override=overrideSource.includes(`'${lf}:${id}'`)||overrideSource.includes(`\"${lf}:${id}\"`);
                  if((type==='text'||options<5)&&!override) rows.push({lf,id,type,options,question});
                }
              }
              ts.forEachChild(node,visit);
            };
            visit(sf);
          }
          fs.writeFileSync('public/question-gap-audit.json',JSON.stringify(rows,null,2));
          console.log(`UNCOVERED=${rows.length}`);
          NODE
          node /tmp/audit.mjs
      - name: Commit report
        run: |
          rm .github/workflows/audit-question-gaps.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/question-gap-audit.json .github/workflows/audit-question-gaps.yml
          git commit -m 'Report remaining question option gaps'
          git push
