name: Run quick-check multi-select migration

on:
  push:
    branches: [main]
    paths:
      - 'public/.trigger-unambiguous-quickchecks'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/upgrade_quickchecks.py
      - run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ModuleDetailV4.tsx src/data/lf9Topic6Polish.ts
          git commit -m "Add real multi-answer quick checks to LF9"
          git push
