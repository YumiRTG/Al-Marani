name: Verify thoughtful learning update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-thoughtful-learning.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build production site
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm run build
      - name: Mark verified and remove temporary workflow
        run: |
          printf 'thoughtful-learning-build-ok\n' > public/thoughtful-learning-build.txt
          rm .github/workflows/verify-thoughtful-learning.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/thoughtful-learning-build.txt .github/workflows/verify-thoughtful-learning.yml
          git commit -m "Verify thoughtful question and video build"
          git push
