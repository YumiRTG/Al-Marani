name: Readability audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readability-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit learning-field readability
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          out=[]
          suspicious=['beziehungsweise','grundsätzlich','unter anderem','gegebenenfalls','beispielsweise','Lernvideo-Suche','youtube.com/results','bisherige','Lernunterlage','Unterlage']
          for n in range(1,13):
              p=Path(f'src/data/lf{n}.ts')
              text=p.read_text(encoding='utf-8')
              out.append(f'## LF{n}')
              # topic titles
              titles=re.findall(r"id:\s*['\"]([^'\"]+)['\"]\s*,\s*title:\s*['\"]([^'\"]+)['\"]",text)
              out.append('Topics:')
              for tid,title in titles[:20]:
                  out.append(f'- {tid}: {title}')
              # long text-like literals
              vals=[]
              for m in re.finditer(r"(?:text|description|subtitle|caption|definition):\s*['\"]([^'\"]+)['\"]",text):
                  val=m.group(1)
                  words=len(val.split())
                  if words>=38:
                      vals.append((words,val[:240].replace('\n',' ')))
              vals=sorted(vals,reverse=True)[:10]
              if vals:
                  out.append('Long passages:')
                  for words,val in vals:
                      out.append(f'- {words} words: {val}')
              hits=[]
              for term in suspicious:
                  c=text.lower().count(term.lower())
                  if c: hits.append(f'{term}={c}')
              if hits: out.append('Signals: '+', '.join(hits))
              # video blocks without embedUrl in local object window
              positions=[m.start() for m in re.finditer(r"type:\s*['\"]video['\"]",text)]
              missing=[]
              for pos in positions:
                  chunk=text[pos:pos+700]
                  title_m=re.search(r"title:\s*['\"]([^'\"]+)['\"]",chunk)
                  if 'embedUrl' not in chunk.split('},',1)[0]:
                      missing.append(title_m.group(1) if title_m else '(untitled)')
              if missing:
                  out.append('Videos without embedUrl: '+ ' | '.join(missing[:20]))
              out.append('')
          Path('public/.readability-audit.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.readability-audit.txt
          git commit -m "Record readability audit"
          git push
