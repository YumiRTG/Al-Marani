name: Final readability build check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-readability-check.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm run build
      - name: Record successful build
        run: |
          echo "final readability build successful" > public/.final-readability-ok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/.final-readability-ok
          git commit -m "Verify final readability build"
          git push
